services:
  bff-widget-gia:
    container_name: bff-widget-gia-dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - APP_PORT=${APP_PORT:-3000}
      - REDIS_HOST=${REDIS_HOST:-redis-global-gia-dev}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - BFF_CACHE_ENABLED=${BFF_CACHE_ENABLED:-true}
      - BFF_CACHE_DEFAULT_TTL=${BFF_CACHE_DEFAULT_TTL:-300}
      - MS_AUTH_URL=${MS_AUTH_URL:-http://ms-auth-gia-dev:3020}
      - MS_AGENTS_URL=${MS_AGENTS_URL:-http://ms-agents-gia-dev:3040}
      - MS_CUSTOMERS_URL=${MS_CUSTOMERS_URL:-http://ms-customers-gia-dev:3000}
      # SPEC-167 - la segunda puerta del mensaje del widget (ADR-034).
      - MS_LEADS_URL=${MS_LEADS_URL:-http://ms-leads-gia-dev:3150}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    networks:
      coolify:
        aliases:
          - bff-widget-gia-dev
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  coolify:
    name: coolify
    external: true

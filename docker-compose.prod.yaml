services:
  bff-widget-gia:
    container_name: bff-widget-gia-prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_PORT=${APP_PORT:-3000}
      - REDIS_HOST=${REDIS_HOST:-redis-global-gia-prod}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - BFF_CACHE_ENABLED=${BFF_CACHE_ENABLED:-true}
      - BFF_CACHE_DEFAULT_TTL=${BFF_CACHE_DEFAULT_TTL:-300}
      - MS_AUTH_URL=${MS_AUTH_URL:-http://ms-auth-gia-prod:3020}
      - MS_AGENTS_URL=${MS_AGENTS_URL:-http://ms-agents-gia-prod:3040}
      - MS_CUSTOMERS_URL=${MS_CUSTOMERS_URL:-http://ms-customers-gia-prod:3000}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    networks:
      coolify:
        aliases:
          - bff-widget-gia-prod
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  coolify:
    name: coolify
    external: true
